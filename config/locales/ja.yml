# 相対時刻（time_ago_in_words）の日本語だけ。既定ロケールは en のまま、必要な箇所で locale: :ja を渡す。
# rails-i18n を入れて全部を ja にするのは、ActiveRecord のエラー文言まで変わるので別に決める
ja:
  datetime:
    distance_in_words:
      half_a_minute: 30秒
      less_than_x_seconds:
        one: 1秒未満
        other: "%{count}秒未満"
      x_seconds:
        one: 1秒
        other: "%{count}秒"
      less_than_x_minutes:
        one: 1分未満
        other: "%{count}分未満"
      x_minutes:
        one: 1分
        other: "%{count}分"
      about_x_hours:
        one: 約1時間
        other: 約%{count}時間
      x_days:
        one: 1日
        other: "%{count}日"
      about_x_months:
        one: 約1ヶ月
        other: 約%{count}ヶ月
      x_months:
        one: 1ヶ月
        other: "%{count}ヶ月"
      about_x_years:
        one: 約1年
        other: 約%{count}年
      over_x_years:
        one: 1年以上
        other: "%{count}年以上"
      almost_x_years:
        one: もうすぐ1年
        other: もうすぐ%{count}年
