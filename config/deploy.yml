service: dopafeed

image: philosophynote/dopafeed

# サーバーの Tailscale IP をリポジトリに載せないため環境変数で受ける（ADR 0021）。無ければ Kamal が KeyError で止まる
servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl: true
  host: dopafeed.dev

registry:
  server: ghcr.io
  username: philosophynote
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DOPAFEED_USER_EMAIL
    - DOPAFEED_USER_PASSWORD
    - LITESTREAM_ACCESS_KEY_ID
    - LITESTREAM_SECRET_ACCESS_KEY
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT
    - ANTHROPIC_API_KEY
  clear:
    LITESTREAM_BUCKET: dopafeed-litestream
    LITESTREAM_REGION: ap-northeast-1

    SOLID_QUEUE_IN_PUMA: true

    # プロセス分割と YJIT はメモリを増やすため、一人用ではメモリを優先する（ADR 0003）。
    SOLID_QUEUE_MODE: async
    YJIT_ENABLED: false

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "dopafeed_storage:/rails/storage"

# 512 MB のサーバーでは、起動前の Litestream 復元・db:prepare（bin/docker-entrypoint）と Rails の起動を合わせて
# 30 秒（Kamal の既定）を超え、kamal-proxy が健康診断を諦めてコンテナを止めた。1 GB では測っていないので 120 のまま
deploy_timeout: 120

# 更新中の要求で旧版のアセットが 404 にならないよう、両方の版を残す。
asset_path: /rails/public/assets

builder:
  arch: amd64

# Lightsail の Ubuntu イメージは root で SSH できない（docs/runbook.md §0 4-a）
ssh:
  user: ubuntu
