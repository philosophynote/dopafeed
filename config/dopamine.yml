# 殿（nao）だけが値を変える。エージェントは読むのみ（.claude/settings.json で deny）。
shared:
  read:
    complete_after_seconds: 20
  xp:
    base: 10
    roulette_duration_ms: 500
    combo_multiplier_step: 0.1
    combo_max_multiplier: 2.0
    tiers:
      - { name: common, multiplier: 1, probability: 0.70 }
      - { name: rare, multiplier: 3, probability: 0.25 }
      - { name: jackpot, multiplier: 10, probability: 0.05 }
  daily_goal:
    articles: 5
    reset_hour: 4
    bonus_xp: 100
  fetch:
    timeout_seconds: 10
    max_body_megabytes: 5
  swipe:
    dismiss_threshold_ratio: 0.4
    submit_timeout_seconds: 10
  claude:
    summary_model: claude-haiku-5-5
    curation_model: claude-sonnet-5-5
    daily_call_limit: 200
    summary_max_tokens: 300
    summary_input_chars: 6000
    timeout_seconds: 30
  comments:
    personas_shown: 3
  push:
    digest_at: "07:30"
    streak_warning_at: "21:00"
