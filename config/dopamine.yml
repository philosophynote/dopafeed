# 殿（nao）だけが値を変える。エージェントは読むのみ（.claude/settings.json で deny）。
shared:
  read:
    complete_after_seconds: 20
  cards:
    reveal_duration_ms: 500
    reveal_stagger_ms: 120
    fever_combo: 5
    record_floor: 2
    rarities:
      - { name: normal, min_total: 6 }
      - { name: rare, min_total: 20 }
      - { name: s_rare, min_total: 25 }
      - { name: ss_rare, min_total: 28 }
  daily_goal:
    articles: 5
    reset_hour: 4
  fetch:
    timeout_seconds: 10
    max_body_megabytes: 5
  retention:
    dismissed_days: 1
    unread_days: 3
  delete_mode:
    combo_small_every: 5
    combo_large_every: 10
  swipe:
    dismiss_threshold_ratio: 0.4
    submit_timeout_seconds: 10
  claude:
    summary_model: claude-haiku-5-5
    curation_model: claude-sonnet-5-5
    daily_call_limit: 200
    summary_max_tokens: 300
    summary_input_chars: 6000
    timeout_seconds: 30
  comments:
    personas_shown: 3
    model: grok-4.3
    max_tokens: 8000
    timeout_seconds: 60
    stream_interval_ms: 250
  push:
    digest_at: "07:30"
    streak_warning_at: "21:00"
  judgment:
    model: jev-latest
    input_chars: 20000
    timeout_seconds: 30
