<html><head><meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS"><title>文字コードの罠</title></head>
<body><article>
<p>このページは Shift_JIS で書かれている。本番の Ruby 4 では ruby-readability の文字コード推定が動かないので、自前で推定してから渡す必要がある。</p>
<p>ここが UTF-8 に直って保存されていれば、要約ジョブに渡したときに文字化けしない。確認のための二つ目の段落で、二十五文字より長くしてある。</p>
<p>三つ目の段落。readability は段落の長さで本文候補を点数づけするので、短すぎると本文として拾われない。</p>
</article></body></html>
