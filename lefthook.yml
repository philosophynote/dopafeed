pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: bin/rubocop -A {staged_files} && git add {staged_files}
    erb_lint:
      glob: "*.erb"
      run: bundle exec erb_lint --autocorrect {staged_files} && git add {staged_files}
pre-push:
  commands:
    test:
      run: bin/rails test
