# 段を二重管理しないよう、実行内容は config/ci.rb に集約する。
name: CI
# main への push では deploy.yml が workflow_call で呼ぶ。ここにも push を書くと main で二度走る
on:
  pull_request:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    # 通常は全体で 1 分強。何かが固まったとき GitHub の既定（6 時間）まで走り続けないよう打ち切る
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run bin/ci (Setup → Style → Security → Structure → Tests → Seeds)
        run: bin/ci
