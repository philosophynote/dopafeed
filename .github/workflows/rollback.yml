name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "戻す先の版（40 桁の commit SHA。Mac の kamal app containers で見る）"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      # 入力を run: に直に埋めるとシェルの命令として解釈されうるので、環境変数で渡す
      VERSION: ${{ inputs.version }}
    steps:
      # kamal rollback は版が見つからなくても終了コード 0 で抜けるので、形を先に検める
      - name: Check version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "40 桁の commit SHA を入れる"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # 古いコンテナを起こし直すときに env ファイルを上げ直すので、Rollback にも鍵が要る
      - name: Write config/master.key
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          umask 077
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key

      - name: Rollback
        run: bin/kamal rollback "$VERSION"

      - name: Check running version
        run: |
          if ! bin/kamal app version | grep -q "$VERSION"; then
            echo "本番の版が $VERSION になっていない"
            exit 1
          fi
